name: Dependabot bun.lock

# WHY THIS EXISTS. Every Dependabot PR in this repo fails CI at the install step with
# `error: lockfile had changes, but lockfile is frozen`. Dependabot edits `package.json` and does
# NOT write `bun.lock`, while CI runs `bun install --frozen-lockfile` — so the two disagree and
# every job dies before it builds or tests anything. Measured across the fleet 2026-09-22: TWELVE
# repos carry this exact combination, and the four that had open Dependabot PRs were all failing
# identically. Unrelated bumps cannot fail identically by coincidence; the defect is in the
# contract, not in any bump.
#
# WHY NOT JUST SWITCH `package-ecosystem` TO `bun`. Because that breaks Dependabot outright. Its
# bun parser supports only bun.lock lockfileVersion 1 and these repos write version 2, so on the
# bun ecosystem Dependabot cannot propose updates at all — trading a failing PR for no PR, which
# is worse because it is silent.
#
# WHY NOT JUST DROP --frozen-lockfile. Because CI would then install against an in-memory
# lockfile, go green, and merge `package.json` bumped with `bun.lock` STILL STALE. Master would
# carry an inconsistent pair and ITS next frozen check would fail — a bypass that greens the PR
# and turns master red. The cause survives and the damage moves somewhere more expensive.
#
# HOW IT WORKS. Dependabot PRs only, same-repo only: run `bun install` WITHOUT --frozen-lockfile,
# commit bun.lock if it changed, push. The push uses GITHUB_TOKEN rather than a human identity.
#
# THE HELD RUNS, AND WHY THE LAST STEP IS NOT OPTIONAL. The lockfile push uses GITHUB_TOKEN.
# GitHub DOES create pull_request runs for that push, but it holds each one at
# `action_required`, so the PR reads BLOCKED until someone approves them. Measured 2026-10-02
# with a control in the same window: a `workflow_dispatch` run on the same commit goes green
# but never reaches the PR's check rollup, so it cannot satisfy the required checks, and
# "[skip ci]" removes the held runs and leaves the PR with no checks at all. Only the held
# pull_request runs can gate the PR, so the last step approves them. It approves only runs on
# the commit this job pushed and only runs that this job's own token triggered. That commit
# changes only the lockfile (the commit step stages nothing else), and its workflow files are
# the files that Dependabot's own head already ran without approval, so the approval grants
# nothing new. The approved run of THIS workflow finds bun.lock in sync and
# stops, so the chain ends after one round. The main CI job keeps --frozen-lockfile; this
# does not weaken the gate.
#
# Trigger is `pull_request`, NOT `pull_request_target` — this never checks out untrusted code with
# write credentials. The same-repo condition below enforces that independently.
#
# This file is adapted from the proven original in deepthinking-mcp rather than newly invented.

on:
  pull_request:
    branches: [main, master, develop]

# One regeneration at a time per Dependabot branch. A force-push from Dependabot should cancel the
# in-flight run rather than race two pushes.
concurrency:
  group: dependabot-bun-lock-${{ github.head_ref }}
  # Only a Dependabot push cancels an in-flight run. The run that the approve step releases
  # (actor github-actions[bot]) WAITS instead: cancelling would kill the approving job before
  # it approves the CI runs.
  cancel-in-progress: ${{ github.actor == 'dependabot[bot]' }}

jobs:
  regenerate-lockfile:
    name: Regenerate bun.lock
    if: >-
      (github.actor == 'dependabot[bot]'
        || github.event.pull_request.user.login == 'dependabot[bot]')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Sized to the WORK — one `bun install` and a push, not a test tier.
    timeout-minutes: 10
    # contents:write to push bun.lock; actions:write to approve the pull_request runs that
    # GitHub holds after that push (see THE HELD RUNS above).
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Regenerate bun.lock
        run: bun install

      # TOUCH ONLY bun.lock. If anything else moved, stop rather than guess — a workflow that
      # commits whatever it happens to find is how an unrelated change rides in under a trusted name.
      - name: Commit and push bun.lock if it changed
        id: commit
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain bun.lock)" ]; then
            echo "bun.lock unchanged — nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OTHER=$(git status --porcelain | grep -v ' bun.lock$' || true)
          if [ -n "$OTHER" ]; then
            echo "::error::Refusing to commit — files other than bun.lock changed:"
            echo "$OTHER"
            exit 1
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'deps: regenerate bun.lock'
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Approve the pull_request runs that GitHub holds after the push above. They are the only
      # runs that can satisfy the PR's required checks (see THE HELD RUNS in the header).
      - name: Approve the CI runs held on the regenerated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          ours() {
            gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=pull_request" --jq \
              '.workflow_runs[] | select(.actor.login == "github-actions[bot]") | "\(.id) \(.status)"'
          }
          # The runs appear a few seconds after the push, and not always together: wait for the
          # first one, then 15 s more for the others.
          runs=""
          for _ in $(seq 1 24); do
            runs=$(ours)
            [ -n "$runs" ] && break
            sleep 5
          done
          if [ -z "$runs" ]; then
            echo "::error::GitHub created no pull_request run for $SHA in 120 s, so the PR has no CI on its head."
            exit 1
          fi
          sleep 15
          ours | while read -r id status; do
            if [ "$status" = action_required ]; then
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" > /dev/null
              echo "approved run $id"
            else
              echo "run $id is $status - no approval needed"
            fi
          done
