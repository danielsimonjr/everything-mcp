name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (Daniel runs it
        # locally on Windows), but CI was Linux-only — i.e. it never tested the OS
        # the server actually ships on.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      # --if-present: run each stage only if the repo defines it (universal template).
      - run: bun run --if-present typecheck
      - run: bun run --if-present lint
      - run: bun run --if-present test
      - run: bun run --if-present build

      # Production runtime is NODE; Bun is the dev toolchain. Every step above runs under
      # Bun, so without this the shipped artifact is never executed by the runtime that
      # actually runs it. The six repos reverted during the Bun migration all failed there:
      # on deps Bun's non-hoisted node_modules resolved and Node did not.
      #
      # Fails on a throw, a syntax error, or an unresolvable import. A server that
      # self-starts on import PASSES after 5s -- it started and did not crash. Verified
      # failure-capable before adoption (corrupt artifact -> exit 1; missing dep -> exit 1).
      - name: Node runtime smoke (the shipped artifact must load under Node)
        run: |
          node --input-type=module -e '
            const entry = "./index.js";
            const t = setTimeout(() => {
              console.log("PASS: self-started under Node, no crash within 5s");
              process.exit(0);
            }, 5000);
            import(entry).then(() => {
              clearTimeout(t);
              console.log("PASS: loaded cleanly under Node");
              process.exit(0);
            }).catch((e) => {
              clearTimeout(t);
              console.error("FAIL: " + entry + " did not load under Node -> " + e.message);
              process.exit(1);
            });
          '
