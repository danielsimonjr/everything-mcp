name: CI

on:
  push:
    branches: [main]
  pull_request:
  # An auto-merged Dependabot PR is pushed with GITHUB_TOKEN, and GitHub's recursion guard
  # suppresses workflow triggers for those pushes -- so the default branch can carry a
  # dependency commit with NO run at all. Measured 2026-08-28 across this repo's history.
  # The PR gate still holds (branch protection requires the checks), so what is lost is
  # post-merge telemetry, not the gate. A nightly run re-exercises the branch regardless of
  # who pushed it; workflow_dispatch allows a gap to be backfilled on the spot.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (it runs on the
        # user's Windows box), but we also keep a Linux leg for toolchain/typecheck.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Stdio smoke (source)
        run: bun run scripts/stdio-smoke.ts
      - name: Stdio smoke (built bundle)
        run: bun run scripts/stdio-smoke.ts node bundle/index.js
